<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- خلفية زجاجية متدرجة -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- توهج الجزيرة المحيطي -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- تدرج صاعقة الشحن -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- الخلفية الرئيسية مع حواف ناعمة للتطبيق -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" />

  <!-- هالة التوهج Ambient Glow -->
  <rect x="76" y="166" width="360" height="180" rx="90" fill="url(#glowGrad)" filter="url(#blurFilter)" opacity="0.75" />

  <!-- كبسولة Dynamic Island السوداء -->
  <rect x="96" y="186" width="320" height="140" rx="70" fill="#000000" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" />

  <!-- دائرة الكاميرا داخل الجزيرة -->
  <circle cx="166" cy="256" r="26" fill="#0a0a0c" stroke="#1f2937" stroke-width="3" />
  <circle cx="166" cy="256" r="10" fill="#1e1b4b" />
  <circle cx="162" cy="252" r="4" fill="rgba(255,255,255,0.6)" />

  <!-- شارة شحن البطارية والصاعقة الخضراء -->
  <g transform="translate(306, 226)">
    <circle cx="30" cy="30" r="34" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2" />
    <!-- صاعقة الشحن ⚡ -->
    <path d="M34 12 L18 32 L28 32 L24 48 L42 28 L32 28 Z" fill="url(#boltGrad)" />
  </g>
</svg>
